services:
  db:
    image: postgres:16
    container_name: fraud-pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
     - db:/var/lib/postgresql/data
     - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  db:
    driver: local
