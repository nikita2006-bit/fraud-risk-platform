services:
  db:
    image: postgres:16
    container_name: fraud-pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
     - db:/var/lib/postgresql/data
     - ./sql:/docker-entrypoint-initdb.d:ro
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud-api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/ml/artifacts/fraud_pipeline.pkl
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile.ui
    environment:
      - FRAUD_API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./ui:/app/ui
volumes:
  db:
    driver: local
