services:
  db:
    image: postgres:16
    container_name: fraud-pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud
    ports:
      - "5433:5432"
    volumes:
     - db:/var/lib/postgresql/data
     - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  db:
    driver: local
